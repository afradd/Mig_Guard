# Render Blueprint Specification
# See https://render.com/docs/blueprint-spec for details
services:
  - type: web
    name: mig-guard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PRIMARY_LLM_MODEL
        value: gemini-2.5-flash
      - key: PRIMARY_LLM_API_KEY
        sync: false
